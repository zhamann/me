server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;

    # The proxy in front speaks HTTPS, so redirects stay relative.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build assets have content hashes in their names. An add_header here
    # replaces the ones above, so they're repeated.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
